<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- without this the phone shows a tiny zoomed-out desktop version of the page -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- short text about the app, Lighthouse checks for it in SEO -->
    <meta
      name="description"
      content="Parking Saver remembers where you parked and guides you back to your car."
    />

    <!-- makes the browser bar on Android blue, same as my header -->
    <meta name="theme-color" content="#1e88e5" />

    <title>Parking Saver</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- blue bar at the top with the app name -->
    <header class="app-header">
      <h1 class="app-title">🚗 Parking Saver</h1>
    </header>

    <!-- yellow "you're offline" bar. it's hidden for now,
         I'll show it from JS when the internet goes away -->
    <div id="offline-banner" class="offline-banner" hidden>
      You're offline. Saving spots, the compass and your history still work.
    </div>

    <!-- every screen (Save, Find, History) gets drawn in here by JS,
         so the page itself never has to reload -->
    <main id="app" class="app-main">
      <p>Loading…</p>
    </main>

    <!-- bottom menu, one link per screen.
         the links only change the part after the # in the address,
         the router notices that and swaps the screen -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="#/save" class="nav-link">
        <span class="nav-icon" aria-hidden="true">📍</span>
        <span>Save</span>
      </a>
      <a href="#/find" class="nav-link">
        <span class="nav-icon" aria-hidden="true">🧭</span>
        <span>Find</span>
      </a>
      <a href="#/history" class="nav-link">
        <span class="nav-icon" aria-hidden="true">🕘</span>
        <span>History</span>
      </a>
    </nav>

    <!-- type="module" lets me split the code into separate files with import/export,
         and the page doesn't wait for the script before showing up -->
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
